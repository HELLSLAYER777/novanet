name: Build NovaNet

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained folder)
        run: dotnet publish NovaNet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o out

      - uses: actions/upload-artifact@v4
        with:
          name: NovaNet-win-x64
          path: out/

      - name: Zip for release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path out/* -DestinationPath NovaNet-win-x64.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NovaNet-win-x64.zip
